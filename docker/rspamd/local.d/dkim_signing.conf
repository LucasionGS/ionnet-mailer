# Per-domain keys written by the Ionnet Mailer app into the shared "dkim" volume.
path = "/var/lib/rspamd/dkim/$domain.$selector.key";
selector = "mail";
selector_map = "/var/lib/rspamd/dkim/selectors.map";
sign_authenticated = true;
sign_local = true;
sign_networks = "/var/lib/rspamd/local_networks.map";
use_domain = "header";
use_esld = false;
allow_username_mismatch = true;
allow_hdrfrom_mismatch = false;
try_fallback = false;
sign_headers = "(o)from:(o)sender:(o)reply-to:(o)subject:(o)date:(o)message-id:(o)to:(o)cc:(o)mime-version:(o)content-type:(o)content-transfer-encoding:resent-to:resent-cc:resent-from:resent-sender:resent-message-id:(o)in-reply-to:(o)references:list-id:list-help:list-owner:list-unsubscribe:list-unsubscribe-post:list-subscribe:list-post:(o)openpgp:(o)autocrypt";
