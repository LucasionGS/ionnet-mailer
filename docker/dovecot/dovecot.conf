# Ionnet Mailer — Dovecot 2.4 configuration
# Template rendered by entrypoint.sh into /etc/dovecot/dovecot.conf (dovecot/dovecot:2.4.x-root image).

dovecot_config_version = 2.4.3
dovecot_storage_version = 2.4.3

base_dir = /run/dovecot
state_dir = /run/dovecot
log_path = /dev/stdout
auth_verbose = yes

protocols = imap pop3 lmtp sieve

import_environment {
  PATH = %{env:PATH}
  TZ = %{env:TZ}
}

# ---- Mail storage -----------------------------------------------------------
mail_driver = maildir
mail_home = /srv/vmail/%{user | domain}/%{user | username}
mail_path = ~/Maildir
mail_uid = vmail
mail_gid = vmail
mailbox_list_layout = index
mailbox_list_utf8 = yes
mail_utf8_extensions = yes
imap4rev2_enable = yes
imap_hibernate_timeout = 5s

mail_attribute {
  dict file {
    path = %{home}/dovecot-attributes
  }
}

@mailbox_defaults = english
namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}

# ---- Authentication ---------------------------------------------------------
auth_mechanisms = plain login
auth_master_user_separator = *
auth_username_format = %{user | lower}
auth_failure_delay = 2secs
login_trusted_networks = @@MAIL_NETWORK_SUBNET@@

sql_driver = pgsql
pgsql postgres {
  parameters {
    dbname = @@POSTGRES_DB@@
    user = mailreader
    password = @@MAIL_DB_PASSWORD@@
  }
}

# Master user used by the Ionnet Mailer app: logs in as "user@domain*ionnet".
passdb master {
  driver = passwd-file
  passwd_file_path = /run/dovecot/master-users
  master = yes
}

passdb sql {
  query = SELECT password_hash AS password FROM mailboxes WHERE email = '%{user}' AND active
  default_password_scheme = BLF-CRYPT
}

userdb sql {
  query = SELECT '/srv/vmail/%{user | domain}/%{user | username}' AS home, \
                 1000 AS uid, 1000 AS gid, \
                 (quota_bytes::text || 'B') AS quota_storage_size \
          FROM mailboxes WHERE email = '%{user}' AND active
  iterate_query = SELECT email AS username FROM mailboxes WHERE active
}

# ---- Quota ------------------------------------------------------------------
mail_plugins {
  quota = yes
}
# Limit comes from userdb (mailboxes.quota_bytes); 0 = unlimited.
quota "User quota" {
}
quota_exceeded_message = Mailbox is full. Please delete some messages or contact your administrator.

# ---- Services / listeners ---------------------------------------------------
service imap-login {
  process_min_avail = 1
  client_limit = 100
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
service pop3-login {
  process_min_avail = 1
  client_limit = 100
  inet_listener pop3 {
    port = 110
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
}
service managesieve-login {
  process_min_avail = 1
  client_limit = 100
  inet_listener sieve {
    port = 4190
  }
}
service lmtp {
  inet_listener lmtp {
    port = 24
  }
}
service auth {
  # SASL for Postfix (compose network only)
  inet_listener sasl {
    port = 12345
  }
}
service doveadm {
  inet_listener http {
    port = 8080
  }
}
service stats {
  process_min_avail = 1
}

# ---- TLS --------------------------------------------------------------------
ssl = yes
ssl_min_protocol = TLSv1.2
ssl_server {
  cert_file = /certs/tls.crt
  key_file = /certs/tls.key
}

# ---- Protocol plugins -------------------------------------------------------
protocol imap {
  mail_plugins {
    imap_quota = yes
    imap_sieve = yes
    imap_filter_sieve = yes
  }
}
protocol lmtp {
  mail_plugins {
    sieve = yes
  }
}

# ---- Sieve ------------------------------------------------------------------
sieve_script personal {
  driver = file
  path = ~/sieve
  active_path = ~/.dovecot.sieve
}
sieve_script before {
  type = before
  driver = file
  path = /var/lib/dovecot/sieve/before/
}

# ---- Full-text search (flatcurve / Xapian) ----------------------------------
mail_plugins {
  fts = yes
  fts_flatcurve = yes
}
fts_autoindex = yes
fts_autoindex_max_recent_msgs = 999
fts_search_add_missing = yes
language_filters = normalizer-icu snowball stopwords
language_tokenizers = generic email-address
language_tokenizer_generic_algorithm = simple
language en {
  default = yes
  filters = lowercase snowball english-possessive stopwords
}
fts flatcurve {
  substring_search = yes
  commit_limit = 100
}

# ---- Metrics: log auth failures as JSON --------------------------------------
event_exporter log {
  format = json
  time_format = rfc3339
}
metric auth_failures {
  filter = event=auth_request_finished AND NOT success=yes
  exporter = log
}

!include_try vendor.d/*.conf
!include_try local.d/*.conf
